[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.10"
chrono = "0.4.45"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
futures-util = "0.3.34"
image = { version = "0.25.10", features = ["png"] }
reqwest = { version = "0.13.5", features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.33.0", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"

[[bin]]
name = "bench_engine"
path = "src/bin/bench_engine.rs"

[[bin]]
name = "bench_remediation"
path = "src/bin/bench_remediation.rs"

